name: Harvest Threshold Aggregate

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Workflow run id containing threshold-replay shard artifacts"
        required: true
        type: string
      output_name:
        description: "Output name stem for recovered merged files"
        required: false
        default: "harvest_oversight_gap_threshold_replay_full_grid_recovered"
        type: string
      python_version:
        description: "Python version"
        required: false
        default: "3.11"
        type: string

jobs:
  aggregate-existing-shards:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas matplotlib tqdm

      - name: Download existing threshold shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.source_run_id }}" \
            --pattern "threshold-replay-*" \
            --dir downloaded

      - name: Merge threshold replay summaries
        run: |
          python -m experiments.merge_threshold_replay_shards \
            --input-dir downloaded \
            --merged-prefix "results/runs/threshold_replay/curated/${{ inputs.output_name }}" \
            --summary-csv "results/runs/showcase/curated/${{ inputs.output_name }}.csv" \
            --summary-only

      - name: Analyze threshold replay grid
        run: |
          python -m experiments.analyze_threshold_replay_grid \
            --input-csv "results/runs/showcase/curated/${{ inputs.output_name }}.csv" \
            --output-prefix "results/runs/showcase/curated/${{ inputs.output_name }}"

      - name: Upload recovered aggregate bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output_name }}-bundle
          path: |
            results/runs/threshold_replay/curated/${{ inputs.output_name }}_runs.csv
            results/runs/showcase/curated/${{ inputs.output_name }}.csv
            results/runs/showcase/curated/${{ inputs.output_name }}_pair_summary.csv
            results/runs/showcase/curated/${{ inputs.output_name }}_winner_summary.csv
            results/runs/showcase/curated/${{ inputs.output_name }}_condition_summary.csv
            results/runs/showcase/curated/${{ inputs.output_name }}_summary.md
            results/runs/showcase/curated/${{ inputs.output_name }}_table.tex
